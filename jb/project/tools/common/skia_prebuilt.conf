# Pinned prebuilt Skia used by the Skia rendering backend (libawt_skia, -Dsun.java2d.skia=true;
# Windows x64 only in its first version).
#
# Consumed by jb/project/tools/common/scripts/fetch_skia.sh. Update deliberately:
# bump SKIA_TAG and the SKIA_SHA256_* digest together. Digests are the GitHub release
# asset digests and must match before unpacking.
#
# Publisher: JetBrains/skia GitHub releases (built from google/skia chrome/m156 by
# tools/skia_release/build.py on branch skiko-m156: is_official_build, Graphite;
# on Windows with Dawn and Vulkan).
SKIA_PUBLISHER_URL=https://github.com/JetBrains/skia/releases/download
SKIA_TAG=m156-24300fbbcb
SKIA_BUILD_TYPE=Release
SKIA_SHA256_windows_x64=a51a1d52c706129b7c695a3e9ade630758d392a053faac9ae88420ecaea40dbf
# The Chromium and Dawn revisions the backend's GPU list (SKGPUListData.java) was generated from, recorded by
# jb/project/tools/common/scripts/update_gpu_lists.sh; run it with every bump of SKIA_TAG.
SKIA_GPU_LISTS_CHROMIUM=cc77d7ea1ee37d6caf29f127a6dcb14edcea0941
SKIA_GPU_LISTS_DAWN=e03f1d590a8778f8b0d6aa232bf7d7406213fa37
