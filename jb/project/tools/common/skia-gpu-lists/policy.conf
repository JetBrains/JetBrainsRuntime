# How Chromium's and Dawn's GPU lists become the Skia backend's GPU list
# (src/java.desktop/share/classes/sun/java2d/skia/SKGPUListData.java), applied by GPUListConverter.java
# through jb/project/tools/common/scripts/update_gpu_lists.sh with every Skia bump. This file holds the
# decisions; a bump that brings nothing new needs none. The converter stops on anything this file does
# not decide: a feature or workaround name of a Windows entry not listed below, a condition the matcher
# (SKGPUList.java) does not implement, a hand-ported upstream function whose source changed.
#
#   map <list> <feature> <api>...    entries of <list> naming <feature> block these graphics APIs
#   ignore <list> <feature>          entries naming only ignored features are left out (reason given)
#   exclude <list> <id> <reason>     an entry left out (Chromium's test entries, test_group, are left out always)
#   fingerprint <name> <sha256>      the upstream source a hand port follows (see update_gpu_lists.sh)
#
# APIs: dawn (Graphite on Dawn, Direct3D 11 / 12), vulkan (Graphite on native Vulkan); the backend tries Dawn
# first and falls back to Vulkan.
# Lists: software_rendering_list (gpu/config/software_rendering_list.json), gpu_driver_bug_list
# (gpu/config/gpu_driver_bug_list.json).

# GPU acceleration off altogether: neither API.
map software_rendering_list all dawn vulkan
# Chromium's Graphite (on Dawn) off: Graphite is what both APIs run; the entries concern the GPU and
# driver (old Intel generations and drivers, D3D11 feature levels below 12.0), not Dawn alone.
map software_rendering_list skia_graphite dawn vulkan
# Direct3D 11 off: Dawn (which starts on Direct3D 11).
map gpu_driver_bug_list disable_d3d11 dawn
# Chromium's Vulkan off (its compositor and rasterizer on Vulkan): native Vulkan. WebGPU off (Dawn on
# Direct3D 11 / 12 for web content): Dawn. No Windows entries name either at m156.
map software_rendering_list vulkan vulkan
map software_rendering_list accelerated_webgpu dawn

# Features of other Chromium subsystems: none of them concerns Graphite on Dawn or Vulkan.
ignore software_rendering_list accelerated_2d_canvas      Chromium's canvas rasterizer
ignore software_rendering_list accelerated_gl             ANGLE/GL compositing
ignore software_rendering_list accelerated_webgl          WebGL
ignore software_rendering_list accelerated_webgl2         WebGL 2
ignore software_rendering_list accelerated_video_decode   video
ignore software_rendering_list accelerated_video_encode   video
ignore software_rendering_list gpu_tile_rasterization     Chromium's tile rasterization
ignore software_rendering_list rasterization              Chromium's tile rasterization
ignore software_rendering_list webnn                      WebNN
ignore software_rendering_list android_surface_control    Android only


# Dawn's own rule for its Vulkan backend (src/dawn/native/vulkan/PhysicalDeviceVk.cpp,
# PhysicalDevice::InitializeImpl): Intel Windows drivers below 30.0.101.2111 are refused (crbug.com/1338622).
# Graphite on native Vulkan does not go through Dawn, so the rule is carried over by hand. Dawn compares
# the last two segments only (gpu_info::IntelWindowsDriverVersion), as the matcher does for "driver intel"
# (Chromium's intel_driver schema).
manual
entry dawn/PhysicalDeviceVk#intel-windows-driver
description Dawn disables Intel's Vulkan driver on Windows below 30.0.101.2111 (crbug.com/1338622)
blocks vulkan
vendor 0x8086
driver intel < 30.0.101.2111
end
endmanual


ignore software_rendering_list webgpu_on_vk_via_gl_interop    WebGPU for web content (GL interop)

# The driver bug list's workarounds: Chromium's own GL command buffer, ANGLE, video, overlays and GPU process.
# Dawn applies its own per-vendor workarounds inside the library, and Graphite its caps-level ones; none
# of these is a switch of Graphite on Dawn or Vulkan, and MSAA is off in the backend.
ignore gpu_driver_bug_list exit_on_context_lost                                         Chromium's GPU process lifetime
ignore gpu_driver_bug_list disable_depth_texture                                        Chromium's GL command buffer and ANGLE
ignore gpu_driver_bug_list msaa_is_slow                                                 MSAA: the backend never multisamples
ignore gpu_driver_bug_list unpack_overlapping_rows_separately_unpack_buffer             Chromium's GL command buffer and ANGLE
ignore gpu_driver_bug_list disable_dxgi_zero_copy_video                                 Chromium's video and media pipeline
ignore gpu_driver_bug_list disable_nv12_dxgi_video                                      Chromium's video and media pipeline
ignore gpu_driver_bug_list disable_accelerated_vp8_decode                               Chromium's video and media pipeline
ignore gpu_driver_bug_list disable_accelerated_vp9_decode                               Chromium's video and media pipeline
ignore gpu_driver_bug_list disable_direct_composition_video_overlays                    Chromium's DirectComposition overlays
